name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Zotero 10.0.8
        run: |
          wget -q -O /tmp/zotero.tar.bz2 'https://www.zotero.org/download/client/dl?channel=release&platform=linux-x86_64&version=10.0.8'
          tar -xjf /tmp/zotero.tar.bz2 -C /tmp
          echo "ZOTERO_PLUGIN_ZOTERO_BIN_PATH=/tmp/Zotero_linux-x86_64/zotero" >> "$GITHUB_ENV"

      # The test bundle is built by esbuild, which does not typecheck
      - name: Typecheck tests
        run: npx tsc --noEmit -p test/tsconfig.json

      # In CI, zotero-plugin-scaffold downloads Zotero, runs it headless
      # under Xvfb, and exits non-zero if any test fails
      - name: Run tests
        run: npm test

      - name: Build installable plugin
        run: npm run build

      - name: Upload XPI
        uses: actions/upload-artifact@v4
        with:
          name: zotero-pdf-translate-${{ github.sha }}
          path: build/*.xpi
          if-no-files-found: error
