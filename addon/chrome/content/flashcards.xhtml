<?xml version="1.0"?>
<!DOCTYPE window>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://__addonRef__/content/styles/flashcards.css" type="text/css"?>
<window
  id="__addonRef__-flashcards"
  title="Vocabulary Flashcards"
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  windowtype="__addonRef__-flashcards"
  persist="screenX screenY width height"
  width="920"
  height="680"
  onload="Zotero.__addonInstance__.hooks.onFlashcardsLoad(window)"
>
  <script src="chrome://zotero/content/include.js"></script>
  <html:main class="flashcards-shell">
    <html:header class="flashcards-header">
      <html:div>
        <html:p class="eyebrow">VOCABULARY</html:p>
        <html:h1>Flashcards</html:h1>
        <html:p id="flashcard-data-path" class="data-path"></html:p>
      </html:div>
      <html:button id="flashcard-export" class="primary"
        >Export CSV</html:button
      >
    </html:header>
    <html:div id="flashcard-error" class="error" hidden="true"></html:div>
    <html:nav class="tabs" aria-label="Flashcard views">
      <html:button id="flashcard-tab-list" class="active">Library</html:button>
      <html:button id="flashcard-tab-review">Review</html:button>
    </html:nav>
    <html:section id="flashcard-list-view" class="list-view">
      <html:div class="list-toolbar">
        <html:input
          id="flashcard-search"
          type="search"
          placeholder="Search words and meanings…"
        />
        <html:span id="flashcard-count" class="count"></html:span>
      </html:div>
      <html:p id="flashcard-empty" class="empty"></html:p>
      <html:div id="flashcard-list" class="flashcard-list"></html:div>
    </html:section>
    <html:section id="flashcard-review-view" class="review-view" hidden="true">
      <html:div class="review-toolbar">
        <html:button id="flashcard-shuffle">Shuffle</html:button>
        <html:span id="flashcard-review-progress"></html:span>
      </html:div>
      <html:p id="flashcard-review-empty" class="empty"
        >No cards to review.</html:p
      >
      <html:button id="flashcard-review-card" class="review-card" hidden="true">
        <html:strong id="flashcard-review-word"></html:strong>
        <html:span id="flashcard-review-hint"
          >Click or press Space to reveal</html:span
        >
        <html:span id="flashcard-review-meaning"></html:span>
      </html:button>
      <html:div class="review-actions">
        <html:button id="flashcard-prev">← Previous</html:button>
        <html:button id="flashcard-next" class="primary">Next →</html:button>
      </html:div>
    </html:section>
  </html:main>
</window>
